name: Build Play Store AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (her yüklemede artır)"
        required: true
        default: "1"
      version_name:
        description: "Sürüm adı"
        required: true
        default: "1.0.0"
  push:
    branches:
      - main
    paths:
      - ".github/release-trigger"

permissions:
  contents: read

concurrency:
  group: who-is-the-chef-play-aab
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
      RELEASE_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 secret eksik" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD secret eksik" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS secret eksik" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD secret eksik" && exit 1)

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package.json', 'app/**/*.js', 'app/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Build static web app
        run: npm run build

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Apply Who Is the Chef branding
        run: npm run android:brand

      - name: Set Android version
        shell: bash
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${RELEASE_VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${RELEASE_VERSION_NAME}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/who-is-the-chef-upload-key.jks"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256             -keystore "$RUNNER_TEMP/who-is-the-chef-upload-key.jks"             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             "$AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Who-Is-the-Chef-Play-${{ env.RELEASE_VERSION_NAME }}-${{ env.RELEASE_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: error
